<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Indeks Prestasi - SMK Igasar Pindad Bandung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        table {
            width: 65%;
            margin: auto;
           
        }
        input[type="number"], input[type="text"] {
            width: 80px;
            text-align: center;
            padding: 5px;
        }
        button {
            padding: 6px 12px;
            margin: 5px;
        }
        </style>
</head>
<body>

    <table border="1" style="text-align: center;">
        
        <tr>
            <td rowspan="2"><img src="logo igasar.webp" width="60%" height="70%"></td>
            <th style="text-align: center; padding: 15px 10px;">
                Menghitung Indeks Prestasi
            </th>
        </tr>
        <tr>
            <th>
                Peserta didik SMK Igasar Pindad Bandung
            </th>
        </tr>

        <tr>
            <td colspan="2">
                <form id="nilaiForm" onsubmit="return false;" style="display: flex; justify-content: space-around;">
                    
                    <div >
                        <label for="quiz" >Quiz (10%) :</label>
                        <input type="number" id="quiz" min="0" max="100" required style="width: 50px; text-align: center; border: 1px solid #aaa; padding: 3px;">
                    </div>
                    
                    <div >
                        <label for="tugas">Tugas (20%) :</label>
                        <input type="number" id="tugas" min="0" max="100" required style="width: 50px; text-align: center; border: 1px solid #aaa; padding: 3px;">
                    </div>
                    
                    <div >
                        <label for="uts">UTS (30%) :</label>
                        <input type="number" id="uts" min="0" max="100" required style="width: 50px; text-align: center; border: 1px solid #aaa; padding: 3px;">
                    </div>
                    
                    <div>
                        <label for="uas">UAS (40%) :</label>
                        <input type="number" id="uas" min="0" max="100" required style="width: 50px; text-align: center; border: 1px solid #aaa; padding: 3px;">
                    </div>

                </form>
            </td>
        </tr>

        <tr>
            <td colspan="2" >
                <button type="button" onclick="hitungNilai()">Hitung</button>
                <button type="button" onclick="resetForm()">Ulang</button>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <div >
                    <label>Nilai Akhir :</label>
                    <input type="text" id="nilaiAkhir" readonly >
                </div>
            </td>
        </tr>

        <tr>
            <td colspan="2" >
                <table>
                    <tr>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <label style=" white-space: nowrap; margin-right: 10px;">Indeks Prestasi :</label>
                                <input type="text" id="indeksPrestasi" readonly>
                            </div>
                        </td>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <label style="white-space: nowrap; ">Keterangan :</label>
                                <input type="text" id="keterangan" readonly style="width: 180px;">
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
</body>
<script>
 function hitungNilai() {
    const quizValue = document.getElementById('quiz').value;
    const tugasValue = document.getElementById('tugas').value;
    const utsValue = document.getElementById('uts').value;
    const uasValue = document.getElementById('uas').value;
    if (quizValue === "" || tugasValue === "" || utsValue === "" || uasValue === "") {
        alert("Mohon isi semua nilai sebelum menghitung.");
        
        document.getElementById('nilaiAkhir').value = '';
        document.getElementById('indeksPrestasi').value = '';
        document.getElementById('keterangan').value = '';
        return; 
    }
    const quiz = parseFloat(quizValue);
    const tugas = parseFloat(tugasValue);
    const uts = parseFloat(utsValue);
    const uas = parseFloat(uasValue);
    if (quiz < 0 || quiz > 100 || tugas < 0 || tugas > 100 ||
        uts < 0 || uts > 100 || uas < 0 || uas > 100) {
        
        alert("Mohon isi semua nilai dengan angka yang valid (0-100) sebelum menghitung.");
        
        document.getElementById('nilaiAkhir').value = '';
        document.getElementById('indeksPrestasi').value = '';
        document.getElementById('keterangan').value = '';
        return; 
    }
    let nilaiAkhir = 
        (quiz * 0.10) + 
        (tugas * 0.20) + 
        (uts * 0.30) + 
        (uas * 0.40);

    nilaiAkhir = nilaiAkhir.toFixed(2); 

    let indeksPrestasi;
    let keterangan;
    const nilai = parseFloat(nilaiAkhir); 

    if (nilai > 80 && nilai <= 100) {
        indeksPrestasi = 'A';
        keterangan = 'Lulus dengan sangat baik';
    } else if (nilai > 68 && nilai <= 80) {
        indeksPrestasi = 'B';
        keterangan = 'Lulus dengan baik';
    } else if (nilai > 55 && nilai <= 68) {
        indeksPrestasi = 'C';
        keterangan = 'Lulus dengan cukup';
    } else if (nilai > 38 && nilai <= 55) {
        indeksPrestasi = 'D';
        keterangan = 'Lulus dengan kurang';
    } else { 
        indeksPrestasi = 'E';
        keterangan = 'Tidak Lulus';
    }
    document.getElementById('nilaiAkhir').value = nilaiAkhir;
    document.getElementById('indeksPrestasi').value = indeksPrestasi;
    document.getElementById('keterangan').value = keterangan;
}
function resetForm() {
    setTimeout(() => {
        document.getElementById('nilaiAkhir').value = '';
        document.getElementById('indeksPrestasi').value = '';
        document.getElementById('keterangan').value = '';
        document.getElementById('nilaiForm').reset();
    }, 50);
}
</script>
</html>
